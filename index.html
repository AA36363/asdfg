<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>モンスト壁反射ガイド</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- 上側：ステージ描画エリア（92%サイズ） -->
    <div class="stage-area">
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="stageCanvas"></canvas>
      </div>
    </div>

    <!-- 下側：操作パネル -->
    <div class="control-panel">
      <!-- 画像読み込み -->
      <div class="control-group">
        <label for="imageInput" class="file-btn">スクショ画像を選択</label>
        <input type="file" id="imageInput" accept="image/*">
        <p id="fileName" class="file-name">画像が未選択です</p>
      </div>

      <!-- ステージ枠リセット -->
      <div class="control-group" id="stageControlGroup" style="display: none;">
        <button id="resetRectBtn" class="sub-btn">枠を初期配置に戻す</button>
      </div>

      <!-- キャラ判定円 ＆ 発射・角度設定 -->
      <div class="control-group" id="calcControlGroup" style="display: none;">
        <div class="slider-group">
          <label>キャラ判定円サイズ: <span id="ringSizeValue" class="highlight-val">45</span>px</label>
          <input type="range" id="ringSizeSlider" min="20" max="80" value="45">
        </div>

        <div class="slider-group">
          <label>反射回数: <span id="reflectCountValue" class="highlight-val">5</span> 回</label>
          <input type="range" id="reflectCountSlider" min="1" max="15" value="5">
        </div>
        
        <div class="slider-group">
          <label>発射角度: <span id="angleValue" class="highlight-val">45.0</span>°</label>
          <input type="range" id="angleSlider" min="0" max="360" step="0.1" value="45.0">
        </div>

        <div class="fine-tune-buttons">
          <button class="step-btn" data-step="-1.0">-1°</button>
          <button class="step-btn" data-step="-0.1">-0.1°</button>
          <button class="step-btn" data-step="0.1">+0.1°</button>
          <button class="step-btn" data-step="1.0">+1°</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
